name: Temporary Phase 20 Cloudflare Preview

on:
  workflow_dispatch:
  push:
    branches:
      - preview/phase20-pilot-readiness
    paths:
      - "**"
      - ".github/workflows/cloudflare-phase20-preview.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-phase20-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 20 preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend in synthetic demo mode
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_BASE_URL: ""
          VITE_APP_VERSION: "phase20-pilot-readiness-preview"

      - name: Set up Wrangler
        run: npm install --global wrangler

      - name: Create isolated temporary Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          wrangler pages project create vitalguard-ai-phase20-preview --production-branch main || true

      - name: Deploy isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name vitalguard-ai-phase20-preview --branch phase20-pilot-readiness
