name: Validate VitalGuard AI

on:
  push:
    branches: [main, phase-3-risk-engine]
  pull_request:
    branches: [main, phase-3-risk-engine]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      # Disposable database so the PostgreSQL storage path is tested, not only SQLite.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vitalguard_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITALGUARD_TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/vitalguard_test
      VITALGUARD_TEST_REQUIRE_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q -rs
